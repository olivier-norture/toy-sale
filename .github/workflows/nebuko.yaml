# Generated by the Nebuko easy setup. Re-running the setup rewrites it.
name: Nebuko

on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  agent:
    uses: nebuko/nebuko/.github/workflows/nebuko-workflow.yaml@main
    with:
      agent_config_path: ".nebuko/agents/agent-config.yaml"
      runs_on: "ubuntu-latest"
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
