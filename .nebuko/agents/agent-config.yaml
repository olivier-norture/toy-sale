# Generated by the Nebuko easy setup. Re-running the setup rewrites it.
providers:
  mistral:
    api_url: "https://api.mistral.ai/v1"
    api_token_env: "MISTRAL_API_KEY"

llms:
  mistral-large-4:
    model_path: "mistral/mistral-large-4"
    provider: "${providers.mistral}"

agents:
  architect:
    model: "${llms.mistral-large-4}"
    role: "Principal software engineer — analysis, architecture and planning."
    prompt_file: "defaults/prompts/architect.md"
    tools: ["finish", "finalize"]

  dev:
    model: "${llms.mistral-large-4}"
    role: "Implementation engineer — writes code, runs tests and opens pull requests."
    prompt_file: "defaults/prompts/dev.md"
    tools: ["finish", "finalize"]
